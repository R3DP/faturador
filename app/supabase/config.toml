# Para consultar a documentação detalhada de configuração, acesse:
# https://supabase.com/docs/guides/local-development/cli/config
# Texto usado para distinguir projetos Supabase diferentes no mesmo host. Por padrão, usa o
# nome do diretório de trabalho ao executar supabase init.
project_id = "billr"

[api]
enabled = true
# Porta usada pela URL da API.
port = 55421
# Schemas expostos na API. Tabelas, views e procedimentos armazenados neste schema terão endpoints
# na API. Os schemas public e graphql_public são incluídos por padrão.
schemas = ["public", "graphql_public"]
# Schemas adicionais incluídos no search_path de cada requisição.
extra_search_path = ["public", "extensions"]
# Número máximo de linhas retornadas por uma view, tabela ou procedimento armazenado. Limita o tamanho
# da resposta para evitar requisições acidentais ou maliciosas.
max_rows = 1000

[api.tls]
# Habilita endpoints HTTPS locais usando um certificado autoassinado.
enabled = false
# Caminhos para o par de certificados autoassinados.
# cert_path = "../certs/my-cert.pem"
# key_path = "../certs/my-key.pem"

[db]
# Porta usada pela URL do banco de dados local.
port = 55422
# Porta usada pelo comando db diff para inicializar o banco de dados sombra.
shadow_port = 55420
# Versão principal do banco de dados a ser usada. Deve ser igual à do banco remoto. Execute SHOW
# server_version; no banco remoto para conferir.
major_version = 17

[db.pooler]
enabled = false
# Porta usada pelo pool de conexões local.
port = 55429
# Define quando uma conexão com o servidor pode ser reutilizada por outros clientes.
# Configure um dos modos de pooler compatíveis: transaction, session.
pool_mode = "transaction"
# Número de conexões com o servidor permitidas por par usuário/banco de dados.
default_pool_size = 20
# Número máximo de conexões de clientes permitidas.
max_client_conn = 100

# [db.vault]
# secret_key = "env(SECRET_VALUE)"

[db.migrations]
# Se desabilitado, as migrações serão ignoradas durante db push ou db reset.
enabled = true
# Define uma lista ordenada de arquivos de schema que descrevem o banco de dados.
# Aceita padrões glob relativos ao diretório supabase: "./schemas/*.sql"
schema_paths = []

[db.seed]
# Se habilitado, carrega os dados iniciais no banco após as migrações durante db reset.
enabled = true
# Define uma lista ordenada de arquivos de dados iniciais a carregar durante db reset.
# Aceita padrões glob relativos ao diretório supabase: "./seeds/*.sql"
sql_paths = ["./seed.sql"]

[db.network_restrictions]
# Habilita o gerenciamento de restrições de rede.
enabled = false
# Lista de blocos CIDR IPv4 autorizados a se conectar ao banco de dados.
# Por padrão, permite todas as conexões IPv4. Defina uma lista vazia para bloquear todos os IPs.
allowed_cidrs = ["0.0.0.0/0"]
# Lista de blocos CIDR IPv6 autorizados a se conectar ao banco de dados.
# Por padrão, permite todas as conexões IPv6. Defina uma lista vazia para bloquear todos os IPs.
allowed_cidrs_v6 = ["::/0"]

[realtime]
enabled = true
# Vincula o Realtime a IPv4 ou IPv6. (padrão: IPv4)
# ip_version = "IPv6"
# Tamanho máximo, em bytes, dos cabeçalhos de requisições HTTP. (padrão: 4096)
# max_header_length = 4096

[studio]
enabled = true
# Porta usada pelo Supabase Studio.
port = 55423
# URL externa do servidor de API ao qual o frontend se conecta.
api_url = "http://127.0.0.1"
# Chave de API da OpenAI usada pelo Supabase AI no Supabase Studio.
openai_api_key = "env(OPENAI_API_KEY)"

# Servidor de teste de e-mail. As mensagens da configuração local de desenvolvimento não são enviadas; elas
# são monitoradas, e você pode ver na interface web quais mensagens seriam enviadas.
[inbucket]
enabled = true
# Porta usada pela interface web do servidor de teste de e-mail.
port = 55424
# Remova o comentário para expor portas adicionais e testar aplicações que enviam e-mails.
# smtp_port = 55425
# pop3_port = 55426
# admin_email = "admin@email.com"
# sender_name = "Admin"

[storage]
enabled = true
# Tamanho máximo de arquivo permitido (por exemplo, "5MB" ou "500KB").
file_size_limit = "50MiB"

# Remova o comentário para configurar buckets de armazenamento locais.
# [storage.buckets.images]
# public = false
# file_size_limit = "50MiB"
# allowed_mime_types = ["image/png", "image/jpeg"]
# objects_path = "./images"

# Permite conexões por clientes compatíveis com S3.
[storage.s3_protocol]
enabled = true

# A API de transformação de imagens está disponível no plano Supabase Pro.
# [storage.image_transformation]
# enabled = true

# Armazena dados analíticos no S3 para executar tarefas ETL sobre o catálogo Iceberg.
# Este recurso está disponível apenas na plataforma hospedada.
[storage.analytics]
enabled = false
max_namespaces = 5
max_tables = 10
max_catalogs = 2

# Buckets de Analytics estão disponíveis no plano Supabase Pro.
# [storage.analytics.buckets.my-warehouse]

# Armazena embeddings vetoriais no S3 para conjuntos de dados grandes e duráveis.
# Este recurso está disponível apenas na plataforma hospedada.
[storage.vector]
enabled = false
max_buckets = 10
max_indexes = 5

# Buckets vetoriais estão disponíveis no plano Supabase Pro.
# [storage.vector.buckets.documents-openai]

[auth]
enabled = true
# URL base do site. Usada como lista de permissões para redirecionamentos e para montar URLs usadas
# em e-mails.
site_url = "http://localhost:3000"
# Lista de URLs exatas para as quais provedores de autenticação podem redirecionar após autenticar.
additional_redirect_urls = ["http://localhost:3000/**"]
# Tempo de validade dos tokens, em segundos. Padrão: 3600 (1 hora); máximo: 604800 (1 semana).
jwt_expiry = 3600
# URL do emissor JWT. Se não definida, usa a URL local da API (http://127.0.0.1:<port>/auth/v1).
# jwt_issuer = ""
# Caminho para a chave de assinatura JWT. NÃO versione o arquivo de chaves de assinatura no git.
# signing_keys_path = "./signing_keys.json"
# Se desabilitado, o token de atualização nunca expirará.
enable_refresh_token_rotation = true
# Permite reutilizar tokens de atualização após expirarem, até o intervalo especificado em segundos.
# Requer enable_refresh_token_rotation = true.
refresh_token_reuse_interval = 10
# Permite ou impede novos cadastros de usuários no projeto.
enable_signup = true
# Permite ou impede autenticações anônimas no projeto.
enable_anonymous_sign_ins = false
# Permite ou impede testes de vinculação manual de contas.
enable_manual_linking = false
# Senhas menores que este valor serão rejeitadas como fracas. Mínimo: 6; recomendado: 8 ou mais.
minimum_password_length = 6
# Senhas que não atenderem aos requisitos a seguir serão rejeitadas como fracas. Valores aceitos:
# letters_digits, lower_upper_letters_digits, lower_upper_letters_digits_symbols
password_requirements = ""

[auth.rate_limit]
# Número de e-mails que podem ser enviados por hora. Requer auth.email.smtp habilitado.
email_sent = 2
# Número de mensagens SMS que podem ser enviadas por hora. Requer auth.sms habilitado.
sms_sent = 30
# Número de autenticações anônimas por hora e por endereço IP. Requer enable_anonymous_sign_ins = true.
anonymous_users = 30
# Número de sessões que podem ser renovadas a cada 5 minutos por endereço IP.
token_refresh = 150
# Número de solicitações de cadastro e autenticação a cada 5 minutos por endereço IP (exceto usuários anônimos).
sign_in_sign_ups = 30
# Número de verificações de OTP/link mágico a cada 5 minutos por endereço IP.
token_verifications = 30
# Número de autenticações Web3 a cada 5 minutos por endereço IP.
web3 = 30

[auth.email]
# Permite ou impede novos cadastros por e-mail no projeto.
enable_signup = true
# Se habilitado, o usuário precisará confirmar alterações de e-mail tanto no endereço antigo quanto no novo.
# Se desabilitado, será necessário confirmar apenas o endereço novo.
double_confirm_changes = true
# Se habilitado, os usuários precisarão confirmar o endereço de e-mail antes de entrar.
enable_confirmations = false
# Se habilitado, os usuários precisarão se autenticar novamente ou ter entrado recentemente para alterar a senha.
secure_password_change = false
# Define o intervalo mínimo antes do envio de outra confirmação de cadastro ou redefinição de senha por e-mail.
max_frequency = "1s"
# Número de caracteres do OTP enviado por e-mail.
otp_length = 6
# Tempo, em segundos, até o OTP por e-mail expirar (padrão: 1 hora).
otp_expiry = 3600

# Use um servidor SMTP pronto para produção.
# [auth.email.smtp]
# enabled = true
# host = "smtp.sendgrid.net"
# port = 587
# user = "apikey"
# pass = "env(SENDGRID_API_KEY)"
# admin_email = "admin@email.com"
# sender_name = "Admin"

# Remova o comentário para personalizar o modelo de e-mail.
# [auth.email.template.invite]
# subject = "You have been invited"
# content_path = "./supabase/templates/invite.html"

# Remova o comentário para personalizar o modelo de e-mail de notificação.
# [auth.email.notification.password_changed]
# enabled = true
# subject = "Your password has been changed"
# content_path = "./templates/password_changed_notification.html"

[auth.sms]
# Permite ou impede novos cadastros por SMS no projeto.
enable_signup = false
# Se habilitado, os usuários precisarão confirmar o número de telefone antes de entrar.
enable_confirmations = false
# Modelo para enviar OTP aos usuários.
template = "Your code is {{ .Code }}"
# Define o intervalo mínimo antes do envio de outro OTP por SMS.
max_frequency = "5s"

# Use um mapeamento predefinido entre números de telefone e OTP para testes.
# [auth.sms.test_otp]
# 4152127777 = "123456"

# Configure os limites de duração das sessões autenticadas.
# [auth.sessions]
# Força o encerramento da sessão após o período especificado.
# timebox = "24h"
# Força o encerramento da sessão se o usuário ficar inativo por mais que o período especificado.
# inactivity_timeout = "8h"

# Este hook é executado antes da criação de um usuário e permite rejeitar a solicitação com base nos dados recebidos.
# [auth.hook.before_user_created]
# enabled = true
# uri = "pg-functions://postgres/auth/before-user-created-hook"

# Este hook é executado antes da emissão de um token e permite adicionar claims conforme o método de autenticação utilizado.
# [auth.hook.custom_access_token]
# enabled = true
# uri = "pg-functions://<database>/<schema>/<hook_name>"

# Configure um dos provedores de SMS compatíveis: twilio, twilio_verify, messagebird, textlocal, vonage.
[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
# NÃO versione seu token de autenticação do Twilio no git. Use a substituição por variável de ambiente:
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

# A autenticação multifator está disponível no plano Supabase Pro.
[auth.mfa]
# Controla quantos fatores de MFA cada usuário pode cadastrar ao mesmo tempo.
max_enrolled_factors = 10

# Controla a MFA por aplicativo autenticador (TOTP).
[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

# Configure a MFA por mensagens no telefone.
[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# Configure a MFA por WebAuthn.
# [auth.mfa.web_authn]
# enroll_enabled = true
# verify_enabled = true

# Use um provedor OAuth externo. A lista completa de provedores é: apple, azure, bitbucket,
# discord, facebook, github, gitlab, google, keycloak, linkedin_oidc, notion, twitch,
# twitter, slack, spotify, workos, zoom.
[auth.external.apple]
enabled = false
client_id = ""
# NÃO versione o segredo do provedor OAuth no git. Use a substituição por variável de ambiente:
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
# Substitui o redirectUrl padrão da autenticação.
redirect_uri = ""
# Substitui a URL padrão do provedor de autenticação. Permite usar GitLab auto-hospedado, Azure de locatário único
# ou qualquer outro provedor OIDC de terceiros.
url = ""
# Se habilitado, a verificação de nonce será ignorada. Necessário para autenticação local com Google.
skip_nonce_check = false
# Se habilitado, permite que o usuário se autentique mesmo quando o provedor não retorna um endereço de e-mail.
email_optional = false

# Permite que titulares de carteiras Solana entrem no projeto pelo padrão Sign in with Solana (SIWS, EIP-4361).
# É possível configurar o limite de taxa web3 na seção [auth.rate_limit] e [auth.captcha] ao hospedar por conta própria.
[auth.web3.solana]
enabled = false

# Use Firebase Auth como provedor de terceiros junto com Supabase Auth.
[auth.third_party.firebase]
enabled = false
# project_id = "my-firebase-project"

# Use Auth0 como provedor de terceiros junto com Supabase Auth.
[auth.third_party.auth0]
enabled = false
# tenant = "my-auth0-tenant"
# tenant_region = "us"

# Use AWS Cognito (Amplify) como provedor de terceiros junto com Supabase Auth.
[auth.third_party.aws_cognito]
enabled = false
# user_pool_id = "my-user-pool-id"
# user_pool_region = "us-east-1"

# Use Clerk como provedor de terceiros junto com Supabase Auth.
[auth.third_party.clerk]
enabled = false
# Obtenha em https://clerk.com/setup/supabase
# domain = "example.clerk.accounts.dev"

# Configuração do servidor OAuth.
[auth.oauth_server]
# Habilita a funcionalidade de servidor OAuth.
enabled = false
# Caminho da interface do fluxo de consentimento OAuth.
authorization_url_path = "/oauth/consent"
# Permite o registro dinâmico de clientes.
allow_dynamic_registration = false

[edge_runtime]
enabled = true
# Políticas de solicitação compatíveis: oneshot, per_worker.
# per_worker (padrão): habilita a recarga a quente durante o desenvolvimento local.
# oneshot: modo alternativo caso a recarga a quente cause problemas (por exemplo, em repositórios grandes ou com links simbólicos).
policy = "per_worker"
# Porta para conectar o inspetor do Chrome e depurar edge functions.
inspector_port = 8083
# Versão principal do Deno a ser usada.
deno_version = 2

# [edge_runtime.secrets]
# secret_key = "env(SECRET_VALUE)"

[analytics]
enabled = true
port = 55427
# Configure um dos backends compatíveis: postgres, bigquery.
backend = "postgres"

# Recursos experimentais podem ser descontinuados a qualquer momento.
[experimental]
# Configura o mecanismo de armazenamento Postgres para usar OrioleDB (S3).
orioledb_version = ""
# Configura a URL do bucket S3, por exemplo, <bucket_name>.s3-<region>.amazonaws.com.
s3_host = "env(S3_HOST)"
# Configura a região do bucket S3, por exemplo, us-east-1.
s3_region = "env(S3_REGION)"
# Configura AWS_ACCESS_KEY_ID para o bucket S3.
s3_access_key = "env(S3_ACCESS_KEY)"
# Configura AWS_SECRET_ACCESS_KEY para o bucket S3.
s3_secret_key = "env(S3_SECRET_KEY)"
