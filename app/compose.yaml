name: billr
services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Defina a origem do Faturador}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Defina sua própria URL do Supabase}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Defina sua própria chave pública}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        BILLR_BUILD_HEAP_MB: ${BILLR_BUILD_HEAP_MB:-3072}
    env_file: .env.local
    environment:
      # Origem do Supabase usada entre servidores. Primeiro vem do seu shell e, depois,
      # de .env.local; vazia, usa a URL pública. Consulte docs/self-hosting.md.
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:${BILLR_PORT:-3000}:3000'
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
