name: Solicitação de recurso
description: Sugira um recurso ou uma mudança de comportamento.
title: '[Recurso]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Descreva o problema antes da solução. As solicitações mais úteis explicam a situação de cobrança em que você está, não apenas o controle que gostaria de adicionar.

        É melhor combinar mudanças grandes em uma issue antes de escrever qualquer código.
  - type: textarea
    id: problem
    attributes:
      label: O problema
      description: O que você está tentando fazer e o que torna isso difícil ou impossível hoje?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: O que você gostaria que acontecesse
      description: Descreva o comportamento desejado. Seja específico.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: O que você tentou ou considerou
      description: Alternativas que está usando agora e por que não são suficientes.
  - type: dropdown
    id: area
    attributes:
      label: Qual parte do Faturador?
      options:
        - Faturas e orçamentos
        - Clientes
        - Horas e despesas
        - Contratos
        - Pagamentos e Stripe
        - Cobrança de tarefas para agentes
        - Servidor MCP ou kit de ferramentas para agentes
        - Chaves de API e permissões
        - Relatórios
        - Auto-hospedagem, Docker ou migrações
        - Outro
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Escopo
      options:
        - label: Isso se encaixa no Faturador como ferramenta interna, ou expliquei por que não.
          required: true
  - type: checkboxes
    id: help
    attributes:
      label: Você gostaria de trabalhar nisso?
      options:
        - label: Estou disposto a abrir um pull request para isso.
