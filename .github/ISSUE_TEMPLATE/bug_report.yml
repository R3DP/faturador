name: Relato de bug
description: Algo neste código-fonte funciona incorretamente e você consegue reproduzir o problema.
title: '[Erro]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Agradecemos por dedicar seu tempo para relatar isso.

        **Não use este formulário para problemas de segurança.** Relate vulnerabilidades em privado pela aba Security deste repositório; consulte a política de segurança.

        Nunca cole uma chave de service role, um segredo do Stripe, uma chave de API, uma URL de banco de dados com senha ou uma fatura ou registro real de cliente. Reproduza o problema com dados fictícios.
  - type: checkboxes
    id: preflight
    attributes:
      label: Antes de enviar
      options:
        - label: Isto não é uma vulnerabilidade de segurança.
          required: true
        - label: Pesquisei as issues existentes e não encontrei esta.
          required: true
        - label: Minha reprodução usa dados fictícios e não contém segredos.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: O que aconteceu
      description: O que você esperava e o que aconteceu no lugar?
      placeholder: Ao converter um orçamento em fatura, o orçamento continuou aberto.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Etapas para reproduzir
      description: Os comandos ou cliques exatos, a partir de um estado inicial conhecido.
      placeholder: |
        1. npm run setup:local
        2. Crie uma empresa e um cliente
        3. Crie um orçamento, aprove-o e converta-o
        4. Recarregue a lista de orçamentos
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Saída, logs ou texto do erro
      description: Cole a saída relevante. Remova os segredos antes. O conteúdo será exibido como bloco de código.
      render: shell
  - type: dropdown
    id: install
    attributes:
      label: Como você está executando o Faturador?
      options:
        - Desenvolvimento local (npm run setup:local)
        - Docker ou Compose
        - Outra forma
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão
      description: O commit em que você está (git rev-parse --short HEAD).
      placeholder: 'commit abc1234'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      description: Versão do Node.js, sistema operacional e navegador, se relevante.
      placeholder: 'Node 22.23.1, macOS 15, Firefox 130'
    validations:
      required: true
  - type: textarea
    id: area
    attributes:
      label: Mais alguma coisa
      description: Informe se isso afeta o workspace, as ferramentas MCP, uma migração, o kit de ferramentas de agentes ou vários deles.
