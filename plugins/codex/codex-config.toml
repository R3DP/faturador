# Serviço upstream Billr e Faturador auto-hospedado como servidores MCP para o Codex.
#
# Copie a tabela abaixo para ~/.codex/config.toml em cada projeto ou para
# .codex/config.toml de um projeto confiável. Os campos foram verificados
# em https://learn.chatgpt.com/docs/extend/mcp em 2026-09-23.
#
# Este arquivo é um exemplo. Ele nunca é lido deste repositório.

# --- Serviço upstream Billr, OAuth (alias local: faturador) ----------------
# A URL é tudo de que o Codex precisa. Execute `codex mcp login faturador` uma vez
# para entrar; escolha a empresa e as permissões na tela de consentimento do
# serviço upstream Billr.
[mcp_servers.faturador]
url = "https://mcp.billr.cc"

# --- Serviço upstream Billr, chave de API (alias local: faturador) ---------
# Para uma máquina que não pode fazer login pelo navegador. Crie a chave em
# Agentes e depois Chaves de API, exporte-a no shell que inicia o Codex e deixe
# o Codex lê-la do ambiente. Nunca cole a chave neste arquivo.
#
#   export BILLR_API_KEY=billr_sk_...
#
# [mcp_servers.faturador]
# url = "https://mcp.billr.cc"
# bearer_token_env_var = "BILLR_API_KEY"

# --- Faturador auto-hospedado ----------------------------------------------
# Uma instalação auto-hospedada disponibiliza as mesmas ferramentas em
# <sua origem>/api/mcp.
#
# [mcp_servers.faturador]
# url = "https://billing.example.com/api/mcp"
